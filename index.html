<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js xr - dragging trophy with finger + TransformControls</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
            font-size: 14px;
            text-shadow: 1px 1px 2px #000;
        }
        a { color: #4af; text-decoration: none; }
        #status {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: #0f0;
            font-family: monospace;
            font-size: 13px;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
            z-index: 100;
            line-height: 1.5;
        }
        #controls-help {
            position: absolute;
            top: 40px;
            left: 10px;
            color: #fff;
            font-family: monospace;
            font-size: 11px;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
            z-index: 100;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> xr - dragging trophy with finger
    </div>

    <div id="controls-help">
        ┌── Touch Controls ──┐<br>
        │ Tap axis  : Grab   │<br>
        │ Drag      : Move   │<br>
        │ Tap floor : Place  │<br>
        └────────────────────┘
    </div>

    <div id="status">Iniciando...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "./build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { XRButton } from 'three/addons/webxr/XRButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let container;
        let camera, scene, renderer;
        let controls, transformControls;
        let group, trophyContainer;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        let isDepthSupplied = false;
        const statusEl = document.getElementById('status');

        // ─── Estado del puente táctil ───
        let isDraggingGizmo = false;
        let touchId = null;

        init();
        animate();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x808080);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);

            controls = new OrbitControls(camera, container);
            controls.target.set(0, 1.6, 0);
            controls.update();

            const floorGeometry = new THREE.PlaneGeometry(6, 6);
            const floorMaterial = new THREE.ShadowMaterial({ opacity: 0.25, blending: THREE.CustomBlending, transparent: false });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            floor.name = 'floor';
            scene.add(floor);

            scene.add(new THREE.HemisphereLight(0xbcbcbc, 0xa5a5a5, 3));

            const light = new THREE.DirectionalLight(0xffffff, 3);
            light.position.set(0, 6, 0);
            light.castShadow = true;
            light.shadow.camera.top = 3;
            light.shadow.camera.bottom = -3;
            light.shadow.camera.right = 3;
            light.shadow.camera.left = -3;
            light.shadow.mapSize.set(4096, 4096);
            scene.add(light);

            group = new THREE.Group();
            scene.add(group);

            const geometry = new THREE.BoxGeometry(0.4, 0.4, 0.4);
            const hitMaterial = new THREE.MeshBasicMaterial({
                transparent: true,
                opacity: 0.0,
                depthWrite: false,
                depthTest: false
            });
            trophyContainer = new THREE.Mesh(geometry, hitMaterial);
            trophyContainer.position.set(0, 1.0, -1.5);
            trophyContainer.name = "trophyContainer";
            trophyContainer.renderOrder = -1;
            group.add(trophyContainer);

            const loader = new GLTFLoader();
            loader.load('./models/gltf/Trophy.glb', function (gltf) {
                const trophyModel = gltf.scene;
                trophyModel.traverse(function (child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                trophyModel.scale.set(1.8, 1.8, 1.8);
                trophyModel.position.set(0, 0, 0);
                trophyModel.name = "animatedItem";
                trophyContainer.add(trophyModel);
            }, undefined, function (error) {
                console.error('Error al cargar el trofeo:', error);
            });

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            document.body.appendChild(XRButton.createButton(renderer, {
                'requiredFeatures': ['hit-test'],
                'optionalFeatures': ['depth-sensing'],
                'depthSensing': {
                    'usagePreference': ['gpu-optimized', 'cpu-optimized'],
                    'dataFormatPreference': ['luminance-alpha', 'float32']
                }
            }));

            // ─── TRANSFORM CONTROLS: SOLO TRASLACION ───
            transformControls = new TransformControls(camera, renderer.domElement);
            transformControls.attach(trophyContainer);
            transformControls.setSize(1.2);        // ← MAS GRANDE para AR
            transformControls.setMode('translate');
            transformControls.showX = true;
            transformControls.showY = true;
            transformControls.showZ = true;
            scene.add(transformControls);

            // ─── HACER EL GIZMO VISIBLE EN AR (fondo transparente) ───
            transformControls.traverse(function (child) {
                if (child.isMesh || child.isLine) {
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(function (m) {
                                m.depthTest = false;
                                m.depthWrite = false;
                            });
                        } else {
                            child.material.depthTest = false;
                            child.material.depthWrite = false;
                        }
                    }
                    child.renderOrder = 1000;
                }
            });

            // Desactivar OrbitControls mientras se arrastra
            transformControls.addEventListener('dragging-changed', function (event) {
                controls.enabled = !event.value;
                isDraggingGizmo = event.value;
            });

            // ─── OPCION A: Resetear rotacion al soltar ───
            transformControls.addEventListener('change', function () {
                if (!transformControls.dragging) {
                    trophyContainer.rotation.set(0, 0, 0);
                }
            });

            // ─── PUENTE TACTIL: capturar toques y reenviarlos como PointerEvents ───
            // En WebXR AR, los eventos DOM no llegan al canvas. Capturamos en document
            // y los inyectamos como PointerEvent sintéticos.
            document.addEventListener('touchstart', onTouchStart, { passive: false });
            document.addEventListener('touchmove', onTouchMove, { passive: false });
            document.addEventListener('touchend', onTouchEnd, { passive: false });
            document.addEventListener('touchcancel', onTouchEnd, { passive: false });

            window.addEventListener('resize', onWindowResize);
            renderer.xr.addEventListener('sessionstart', onARSessionStart);
            renderer.xr.addEventListener('sessionend', onARSessionEnd);
        }

        // ─── CONVERTIR TOUCH A POINTEREVENT SINTETICO ───
        function onTouchStart(event) {
            if (!renderer.xr.isPresenting) return; // En desktop, dejar que funcione nativo
            if (event.touches.length !== 1) return;
            event.preventDefault();

            const touch = event.touches[0];
            touchId = touch.identifier;

            // Verificar si el toque cae sobre el gizmo
            updateMouseFromTouch(touch);
            raycaster.setFromCamera(mouse, camera);

            // Si el rayo intersecta alguna parte del gizmo, inyectar pointerdown
            const gizmoIntersects = raycaster.intersectObjects(transformControls.children, true);
            if (gizmoIntersects.length > 0) {
                dispatchSyntheticPointer('pointerdown', touch.clientX, touch.clientY);
            } else {
                // Si no toca el gizmo, intentar hit-test para colocar (en el render loop)
                tryPlaceFromTouch = true;
            }
        }

        function onTouchMove(event) {
            if (!renderer.xr.isPresenting) return;
            if (touchId === null) return;
            event.preventDefault();

            const touch = findTouch(event.touches, touchId);
            if (!touch) return;

            dispatchSyntheticPointer('pointermove', touch.clientX, touch.clientY);
        }

        function onTouchEnd(event) {
            if (!renderer.xr.isPresenting) return;
            if (touchId === null) return;
            event.preventDefault();

            const touch = findTouch(event.changedTouches, touchId);
            if (!touch) return;

            dispatchSyntheticPointer('pointerup', touch.clientX, touch.clientY);
            touchId = null;
            tryPlaceFromTouch = false;
        }

        function findTouch(touchList, id) {
            for (let i = 0; i < touchList.length; i++) {
                if (touchList[i].identifier === id) return touchList[i];
            }
            return null;
        }

        function updateMouseFromTouch(touch) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((touch.clientY - rect.top) / rect.height) * 2 + 1;
        }

        function dispatchSyntheticPointer(type, clientX, clientY) {
            const rect = renderer.domElement.getBoundingClientRect();
            const evt = new PointerEvent(type, {
                bubbles: true,
                cancelable: true,
                pointerId: 1,
                pointerType: 'touch',
                clientX: clientX,
                clientY: clientY,
                button: 0,
                buttons: (type === 'pointerdown' || type === 'pointermove') ? 1 : 0,
                isPrimary: true
            });
            renderer.domElement.dispatchEvent(evt);
        }

        // ─── VARIABLE PARA HIT-TEST DESDE TOUCH ───
        let tryPlaceFromTouch = false;

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onARSessionStart() {
            const session = renderer.xr.getSession();
            controls.enabled = false;
            scene.background = null;

            if (!hitTestSourceRequested) {
                session.requestReferenceSpace('viewer').then((refSpace) => {
                    session.requestHitTestSource({ space: refSpace }).then((source) => {
                        hitTestSource = source;
                    });
                });
                session.addEventListener('end', () => {
                    hitTestSourceRequested = false;
                    hitTestSource = null;
                });
                hitTestSourceRequested = true;
            }
            updateStatus();
        }

        function onARSessionEnd() {
            controls.enabled = true;
            scene.background = new THREE.Color(0x808080);
            updateStatus();
        }

        // ─── COLOCAR OBJETO EN SUPERFICIE REAL (Hit-Test) ───
        function tryPlaceOnSurface(frame, referenceSpace) {
            if (!hitTestSource || !frame) return false;

            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length > 0) {
                const hit = hitTestResults[0];
                const pose = hit.getPose(referenceSpace);
                if (pose) {
                    trophyContainer.position.set(
                        pose.transform.position.x,
                        pose.transform.position.y + 0.2,
                        pose.transform.position.z
                    );
                    trophyContainer.rotation.set(0, 0, 0);
                    return true;
                }
            }
            return false;
        }

        function readDepthFromFrame(frame) {
            if (!frame) return;
            const session = renderer.xr.getSession();
            const refSpace = renderer.xr.getReferenceSpace();
            if (!session || !refSpace) return;
            try {
                const viewerPose = frame.getViewerPose(refSpace);
                if (!viewerPose) return;
                for (const view of viewerPose.views) {
                    const depthInfo = frame.getDepthInformation(view);
                    isDepthSupplied = !!depthInfo;
                }
            } catch (e) {
                isDepthSupplied = false;
            }
        }

        function updateStatus() {
            const depth = isDepthSupplied ? 'ON' : 'OFF';
            const ar = renderer.xr.isPresenting ? 'AR ACTIVO' : 'AR INACTIVO';
            statusEl.innerHTML = `Modo: TRANSLATE | Depth: ${depth} | ${ar}`;
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(time, frame) {
            const elapsedTime = clock.getElapsedTime();
            const refSpace = renderer.xr.getReferenceSpace();

            // Hit-test para colocacion desde touch (cuando no se toco el gizmo)
            if (tryPlaceFromTouch && frame && refSpace) {
                if (tryPlaceOnSurface(frame, refSpace)) {
                    tryPlaceFromTouch = false;
                }
            }

            readDepthFromFrame(frame);

            if (trophyContainer && !transformControls.dragging) {
                const model = trophyContainer.getObjectByName("animatedItem");
                if (model) {
                    model.rotation.y = elapsedTime * 1.5;
                    model.position.y = Math.sin(elapsedTime * 2.5) * 0.03;
                }
            }

            if (Math.floor(elapsedTime * 60) % 10 === 0) updateStatus();
            controls.update();
            renderer.render(scene, camera);
        }

    </script>
</body>
</html>
