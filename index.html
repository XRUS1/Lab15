<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js xr - dragging trophy (Lab15)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }
        a {
            color: #4af;
            text-decoration: none;
        }
        #status {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: #0f0;
            font-family: monospace;
            font-size: 13px;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> xr - dragging trophy (Lab15)
    </div>
    <div id="status">Cargando...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "./build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <!-- ============================================================ -->
    <!-- SCRIPT 1: LAB12 EXACTO. Este script funciona solo. Si falla   -->
    <!-- algo aqui, el problema NO es TransformControls.               -->
    <!-- ============================================================ -->
    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { XRButton } from 'three/addons/webxr/XRButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let container;
        let camera, scene, renderer;
        let controller1;
        let isDepthSupplied = false;
        let raycaster;
        let trophyContainer;

        const intersected = [];
        const tempMatrix = new THREE.Matrix4();
        const clock = new THREE.Clock();

        let controls, group;

        init();
        animate();

        function init() {

            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x808080);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);

            controls = new OrbitControls(camera, container);
            controls.target.set(0, 1.6, 0);
            controls.update();

            const floorGeometry = new THREE.PlaneGeometry(6, 6);
            const floorMaterial = new THREE.ShadowMaterial({ opacity: 0.25, blending: THREE.CustomBlending, transparent: false });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            scene.add(new THREE.HemisphereLight(0xbcbcbc, 0xa5a5a5, 3));

            const light = new THREE.DirectionalLight(0xffffff, 3);
            light.position.set(0, 6, 0);
            light.castShadow = true;
            light.shadow.camera.top = 3;
            light.shadow.camera.bottom = -3;
            light.shadow.camera.right = 3;
            light.shadow.camera.left = -3;
            light.shadow.mapSize.set(4096, 4096);
            scene.add(light);

            group = new THREE.Group();
            scene.add(group);

            // --- CUBO PADRE: invisible ---
            const geometry = new THREE.BoxGeometry(0.4, 0.4, 0.4);
            const hitMaterial = new THREE.MeshBasicMaterial({
                transparent: true,
                opacity: 0.0,
                depthWrite: false,
                depthTest: false
            });
            trophyContainer = new THREE.Mesh(geometry, hitMaterial);
            trophyContainer.position.set(0, 1.0, -1.5);
            trophyContainer.name = "trophyContainer";
            trophyContainer.renderOrder = -1;
            group.add(trophyContainer);

            // --- CARGAR TROFEO GLB ---
            const loader = new GLTFLoader();
            loader.load('./models/gltf/Trophy.glb', function (gltf) {

                const trophyModel = gltf.scene;

                trophyModel.traverse(function (child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                trophyModel.scale.set(1.8, 1.8, 1.8);
                trophyModel.position.set(0, 0, 0);
                trophyModel.name = "animatedItem";

                trophyContainer.add(trophyModel);

            }, undefined, function (error) {
                console.error('Error al cargar el trofeo:', error);
            });

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // --- BOTON XR: EXACTAMENTE COMO LAB12 ---
            document.body.appendChild(XRButton.createButton(renderer, {
                'optionalFeatures': ['depth-sensing'],
                'depthSensing': { 'usagePreference': ['gpu-optimized'], 'dataFormatPreference': ['luminance-alpha'] }
            }));

            // --- CONTROLADOR VR (Lab12 original) ---
            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onSelectStart);
            controller1.addEventListener('selectend', onSelectEnd);
            scene.add(controller1);

            const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -1)
            ]);
            const line = new THREE.Line(lineGeometry);
            line.name = 'line';
            line.scale.z = 5;
            controller1.add(line);

            raycaster = new THREE.Raycaster();
            window.addEventListener('resize', onWindowResize);

            // --- EXPONER AL AMBIENTE GLOBAL PARA SCRIPT 2 ---
            window._lab15 = {
                camera: camera,
                renderer: renderer,
                scene: scene,
                trophyContainer: trophyContainer,
                controls: controls,
                clock: clock,
                group: group,
                controller1: controller1,
                intersected: intersected,
                tempMatrix: tempMatrix,
                raycaster: raycaster
            };

            document.getElementById('status').innerHTML = 'LAB12 listo';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onSelectStart(event) {
            const controller = event.target;
            const intersections = getIntersections(controller);

            if (intersections.length > 0) {
                const intersection = intersections[0];
                const object = intersection.object;
                object.material.opacity = 0.3;
                object.material.color = new THREE.Color(0xffaa00);
                controller.attach(object);
                controller.userData.selected = object;
            }
            controller.userData.targetRayMode = event.data.targetRayMode;
        }

        function onSelectEnd(event) {
            const controller = event.target;

            if (controller.userData.selected !== undefined) {
                const object = controller.userData.selected;
                object.material.opacity = 0.0;
                group.attach(object);
                object.rotation.set(0, 0, 0);
                controller.userData.selected = undefined;
            }
        }

        function getIntersections(controller) {
            controller.updateMatrixWorld();
            tempMatrix.identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
            return raycaster.intersectObjects(group.children, false);
        }

        function intersectObjects(controller) {
            if (controller.userData.targetRayMode === 'screen') return;
            if (controller.userData.selected !== undefined) return;

            const line = controller.getObjectByName('line');
            const intersections = getIntersections(controller);

            if (intersections.length > 0) {
                const intersection = intersections[0];
                const object = intersection.object;
                object.material.opacity = 0.15;
                object.material.color = new THREE.Color(0xffff00);
                intersected.push(object);
                if (line) line.scale.z = intersection.distance;
            } else {
                if (line) line.scale.z = 5;
            }
        }

        function cleanIntersected() {
            while (intersected.length) {
                const object = intersected.pop();
                if (controller1.userData.selected !== object) {
                    object.material.opacity = 0.0;
                }
            }
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            const elapsedTime = clock.getElapsedTime();

            group.rotation.set(0, 0, 0);

            group.children.forEach(cubeContainer => {
                const model = cubeContainer.getObjectByName("animatedItem");
                if (model) {
                    model.rotation.y = elapsedTime * 1.5;
                    model.position.y = Math.sin(elapsedTime * 2.5) * 0.03;
                }
            });

            if (trophyContainer) {
                trophyContainer.rotation.set(0, 0, 0);
            }

            if (renderer.xr.hasDepthSensing && renderer.xr.hasDepthSensing() && !isDepthSupplied) {
                isDepthSupplied = true;
            } else if (renderer.xr.hasDepthSensing && !renderer.xr.hasDepthSensing() && isDepthSupplied) {
                isDepthSupplied = false;
            }

            cleanIntersected();
            intersectObjects(controller1);

            const tc = window._lab15 && window._lab15.transformControls ? 'ON' : 'OFF';
            document.getElementById('status').innerHTML =
                'Modo: ' + (renderer.xr.isPresenting ? 'XR' : 'DESKTOP') +
                ' | TC: ' + tc +
                ' | Depth: ' + (isDepthSupplied ? 'ON' : 'OFF');

            // ACTUALIZAR TRANSFORM CONTROLS SI EXISTE (clave del ejemplo original)
            if (window._lab15 && window._lab15.transformControls) {
                window._lab15.transformControls.update();
            }

            controls.update();
            renderer.render(scene, camera);
        }

    </script>

    <!-- ============================================================ -->
    <!-- SCRIPT 2: TransformControls. COMPLETAMENTE AISLADO.           -->
    <!-- Si este script falla (import roto, incompatibilidad, etc.),   -->
    <!-- el Script 1 sigue funcionando al 100% y START XR debe abrir.  -->
    <!-- ============================================================ -->
    <script type="module">
        try {
            const L = window._lab15;
            if (!L) {
                console.warn('Script principal aun no listo');
                return;
            }

            // Detectar si estamos en movil: en movil NO cargamos TransformControls
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                console.log('Movil detectado: TransformControls omitido');
                return;
            }

            const module = await import('three/addons/controls/TransformControls.js');
            const TransformControls = module.TransformControls;

            if (!TransformControls) {
                console.warn('TransformControls no exportado correctamente');
                return;
            }

            const tc = new TransformControls(L.camera, L.renderer.domElement);
            tc.attach(L.trophyContainer);
            tc.setSize(0.75);
            tc.setMode('translate');
            tc.showX = true;
            tc.showY = true;
            tc.showZ = true;
            L.scene.add(tc);

            tc.addEventListener('dragging-changed', function (event) {
                L.controls.enabled = !event.value;
            });

            L.renderer.xr.addEventListener('sessionstart', function () {
                tc.detach();
                tc.visible = false;
                L.controls.enabled = false;
            });

            L.renderer.xr.addEventListener('sessionend', function () {
                tc.attach(L.trophyContainer);
                tc.visible = true;
                L.controls.enabled = true;
                L.controls.update();
            });

            L.transformControls = tc;
            console.log('TransformControls activo en desktop');

        } catch (err) {
            console.error('TransformControls error:', err);
        }
    </script>

</body>
</html>
