<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js xr - dragging trophy (Lab15) - TransformControls Always</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }
        a {
            color: #4af;
            text-decoration: none;
        }
        #status {
            position: absolute;
            top: 50px;
            left: 10px;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 5px;
        }
    </style>
</head>
<body>

    <div id="info">
        <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> xr - TransformControls always on
    </div>
    <div id="status">Iniciando...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "./build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { XRButton } from 'three/addons/webxr/XRButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let camera, scene, renderer, control, orbit;
        let controller1;
        let trophyContainer;
        let isDepthSupplied = false;

        const clock = new THREE.Clock();

        init();
        animate();

        function init() {

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x808080);

            const floorGeometry = new THREE.PlaneGeometry(6, 6);
            const floorMaterial = new THREE.ShadowMaterial({ opacity: 0.25, blending: THREE.CustomBlending, transparent: false });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            scene.add(new THREE.HemisphereLight(0xbcbcbc, 0xa5a5a5, 3));

            const light = new THREE.DirectionalLight(0xffffff, 3);
            light.position.set(0, 6, 0);
            light.castShadow = true;
            light.shadow.camera.top = 3;
            light.shadow.camera.bottom = -3;
            light.shadow.camera.right = 3;
            light.shadow.camera.left = -3;
            light.shadow.mapSize.set(4096, 4096);
            scene.add(light);

            orbit = new OrbitControls(camera, renderer.domElement);
            orbit.target.set(0, 1.0, -1.5);
            orbit.update();

            // --- Cubo invisible hit-test ---
            const geometry = new THREE.BoxGeometry(0.4, 0.4, 0.4);
            const hitMaterial = new THREE.MeshBasicMaterial({
                transparent: true,
                opacity: 0.0,
                depthWrite: false,
                depthTest: false
            });
            trophyContainer = new THREE.Mesh(geometry, hitMaterial);
            trophyContainer.position.set(0, 1.0, -1.5);
            trophyContainer.name = "trophyContainer";
            trophyContainer.renderOrder = -1;
            scene.add(trophyContainer);

            // --- Cargar trofeo ---
            const loader = new GLTFLoader();
            loader.load('./models/gltf/Trophy.glb', function (gltf) {
                const trophyModel = gltf.scene;
                trophyModel.traverse(function (child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                trophyModel.scale.set(1.8, 1.8, 1.8);
                trophyModel.position.set(0, 0, 0);
                trophyModel.name = "animatedItem";
                trophyContainer.add(trophyModel);
            }, undefined, function (error) {
                console.error('Error al cargar el trofeo:', error);
            });

            // â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
            //  TRANSFORM CONTROLS â€” Siempre activo, antes y despuÃ©s del botÃ³n
            //  Tercer argumento: renderer (esencial para XR)
            // â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
            control = new TransformControls(camera, renderer.domElement, renderer);
            control.addEventListener('dragging-changed', function (event) {
                orbit.enabled = !event.value;
            });
            control.attach(trophyContainer);
            control.setSize(0.75);
            control.setMode('translate');
            control.showX = true;
            control.showY = true;
            control.showZ = true;

            const gizmo = control.getHelper();
            scene.add(gizmo);

            // --- BotÃ³n XR ---
            document.body.appendChild(XRButton.createButton(renderer, {
                'optionalFeatures': ['depth-sensing'],
                'depthSensing': { 'usagePreference': ['gpu-optimized'], 'dataFormatPreference': ['luminance-alpha'] }
            }));

            // --- Controlador VR (referencia visual del rayo) ---
            controller1 = renderer.xr.getController(0);
            scene.add(controller1);

            const lineGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -1)
            ]);
            const line = new THREE.Line(lineGeometry);
            line.name = 'line';
            line.scale.z = 5;
            controller1.add(line);

            window.addEventListener('resize', onWindowResize);

            // â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
            //  ALTERNAR ENTRE DESKTOP Y XR
            //  TransformControls SIEMPRE visible y activo
            // â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
            renderer.xr.addEventListener('sessionstart', function () {
                // En XR: desactivar orbit, gizmo mÃ¡s grande para controladores
                orbit.enabled = false;
                control.setSize(1.5);
                // TransformControls se mantiene attachado y visible
            });

            renderer.xr.addEventListener('sessionend', function () {
                // Al volver a desktop: reactivar orbit, gizmo tamaÃ±o normal
                orbit.enabled = true;
                orbit.update();
                control.setSize(0.75);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            const elapsedTime = clock.getElapsedTime();

            // AnimaciÃ³n del trofeo
            const model = trophyContainer.getObjectByName("animatedItem");
            if (model) {
                model.rotation.y = elapsedTime * 1.5;
                model.position.y = Math.sin(elapsedTime * 2.5) * 0.03;
            }

            trophyContainer.rotation.set(0, 0, 0);

            // Depth sensing
            if (renderer.xr.hasDepthSensing && renderer.xr.hasDepthSensing() && !isDepthSupplied) {
                isDepthSupplied = true;
                console.log('Depth sensing disponible');
            } else if (renderer.xr.hasDepthSensing && !renderer.xr.hasDepthSensing() && isDepthSupplied) {
                isDepthSupplied = false;
            }

            // Status
            const statusEl = document.getElementById('status');
            if (statusEl) {
                const tc = control && control.getHelper() && control.getHelper().visible ? 'ON' : 'OFF';
                statusEl.innerHTML = 'Modo: ' + (renderer.xr.isPresenting ? 'XR' : 'DESKTOP') +
                    ' | TC: ' + tc +
                    ' | Depth: ' + (isDepthSupplied ? 'ON' : 'OFF');
            }

            renderer.render(scene, camera);
        }

    </script>
</body>
</html>
